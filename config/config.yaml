paths:
  data_raw: "./data/raw"

  models:
    saved: "./models/saved"

  output:
    plots: "./results/plots"
    logs: "./logs"
    metrics: "./results/metrics"

data:
  dataset_name: "wikitext"
  dataset_config: "wikitext-103-raw-v1"

  preprocessing:
    tokenizer_name: "bert-base-uncased"
    seq_len: 70

model:
  name: "SLM"
  architecture:
    embedding_dim: 300
    num_layers: 3
    hidden_dim: 1150
    dropoute: 0.1
    dropouti: 0.65
    dropouth: 0.3
    dropouto: 0.4
    weight_drop: 0.


training:
  num_epochs: 50
  batch_size: 32
  weight_decay: 1.2e-6
  momentum: 0.9
  learning_rate: 7.5
  clip: 0.25
  optimizer:
  criterion:
  wandb_enable: True
  wandb_arg_name: 'final'

  early_stopping:
    patience: 5

evaluation:


system:
  device: "cpu"
  n_jobs: -1
  random_seed: 8